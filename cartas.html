<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />

<meta name="description" content="50 mensajes de amor y cosas que se me ocurren de madrugada." />
<meta name="theme-color" content="#f2eade" />
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/css/base.css" />

<body data-page="cartas">

  <header class="nav">
    <a class="nav-mark" href="index.html"><span class="mark-heart">♡</span> <span data-bind="site.shortTitle">para vos</span></a>
    <nav class="nav-links" aria-label="Secciones">

      <a href="cartas.html" aria-current="page">cartas</a>
    </nav>

  <main class="wrap cartas-page">
    <header class="cartas-header">
      <p class="cartas-eyebrow">120 cartitas para ti</p>
      <h1 class="cartas-title">Lo que te diría hoy</h1>
      <p class="cartas-sub">
        Cositas que se me ocurren de madrugada, en medio del día o cada vez que pienso en ti.
      </p>

    <section class="carta-spotlight" aria-label="Mensaje al azar">

      <p id="spotlightText" class="spotlight-text"></p>
      <button id="randomCartaBtn" class="btn-random" type="button">✉ Sacar otro mensaje</button>
    </section>

    <div id="cartasFilters" class="cartas-filters" aria-label="Filtrar mensajes por categoría"></div>

    <section id="cartasGrid" class="cartas-grid" aria-label="Lista de mensajes"></section>

  <footer class="site-foot">
    <span class="foot-time">♡</span>
    <a href="index.html">volver a casa</a>
